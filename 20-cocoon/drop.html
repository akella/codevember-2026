<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cocoon, falling</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
      }
      canvas {
        display: block;
      }
      /* What shows till the first picture is on the screen: the word, its three o's cocoons being wound, pass over
         pass, and lit from behind when they are done. In the page itself, so it is there before any script is, and
         only transforms and opacity move: those go on while the page is busy building its shaders. */
      #loader {
        --T: 4.2s;
        position: fixed;
        inset: 0;
        z-index: 20000;
        display: grid;
        place-content: center;
        background: #000;
        color: #8d8781;
        font: 300 clamp(26px, 6.2vmin, 64px) / 1 "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
        transition: opacity 1.4s ease 0.1s;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #loader .word {
        display: flex;
        align-items: baseline;
        gap: 0.06em;
      }
      #loader b {
        font-weight: inherit;
      }
      #loader em {
        position: relative;
        width: 0.5em;
        height: 0.66em;
        margin: 0 0.05em;
        transform: translateY(0.12em) rotate(calc((var(--k) - 1) * 9deg));
      }
      /* the thread it hangs from */
      #loader em::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 98%;
        width: 1px;
        height: 42vh;
        background: linear-gradient(rgba(255, 246, 234, 0), rgba(255, 246, 234, 0.34));
      }
      /* the light behind it */
      #loader em::before {
        content: "";
        position: absolute;
        inset: -0.5em;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 214, 160, 0.75), rgba(255, 190, 120, 0.22) 45%, rgba(255, 190, 120, 0));
        opacity: 0;
        animation: lit var(--T) ease-in-out calc(var(--k) * 0.35s) infinite both;
      }
      #loader u {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(255, 248, 238, 0.85);
        transform: rotate(calc(var(--r) * 0.35)) scaleX(var(--w));
        opacity: 0;
        animation: wind var(--T) linear calc(var(--k) * 0.35s + var(--i) * 0.13s) infinite both;
      }
      #loader u:first-child {
        transform: none;
      }
      #loader p {
        display: none;
        margin: 0;
        max-width: 24em;
        font-size: 15px;
        line-height: 1.5;
        text-align: center;
      }
      #loader.failed .word {
        display: none;
      }
      #loader.failed p {
        display: block;
      }
      @keyframes wind {
        0% {
          opacity: 0;
        }
        4%,
        36% {
          opacity: 0.8;
        }
        52%,
        100% {
          opacity: 0;
        }
      }
      @keyframes lit {
        0%,
        38% {
          opacity: 0;
        }
        62% {
          opacity: 1;
        }
        92%,
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>

"></u><u style="--r:29deg;--w:0.90;--i:14"></u><u style="--r:-27deg;--w:0.31;--i:15"></u></em><b>n</b><b>i</b><b>n</b><b>g</b></div>
