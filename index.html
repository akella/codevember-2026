<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codevember 2026</title>
    <meta name="description" content="Codevember 2026 experiments by Yuri Artiukh." />
    <meta name="author" content="Yuri Artiukh" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        padding: 1em;
        font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #eee;
        background: #111;
      }
      h1 {
        font-size: 1.4em;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 10px;
        margin: 2em 0;
        list-style: none;
      }
      .gallery li {
        aspect-ratio: 1;
        overflow: hidden;
        background: #222 center / cover no-repeat;
        border-radius: 6px;
      }
      .gallery li > * {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 100%;
        padding: 0.6em;
        color: #fff;
        background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.6));
      }
      .gallery a:hover span:last-child {
        text-decoration: underline;
      }
      .gallery .number {
        font-size: 2em;
        font-weight: bold;
        line-height: 1;
      }
      .gallery .soon {
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <h1>Codevember 2026</h1>
    <main>
      <ul class="gallery">
        <!-- days -->
      </ul>
    </main>
    <footer>
      Yuri Artiukh
      <a href="https://github.com/akella/codevember-2026">github</a>
    </footer>
  </body>
</html>
